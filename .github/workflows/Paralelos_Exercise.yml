name: Operaciones matematicas basicas

on:
  push:
    branches:
      - main
      - feature/*
  workflow_dispatch:
    inputs:
      numero1:
        description: 'Primer numero'
        required: true
        default: '10'
      numero2:
        description: 'Segundo numero'
        required: true
        default: '5'

jobs:
  operaciones:
    strategy:
      matrix:
        operation: [suma, resta, multiplicacion, division]
    runs-on: ubuntu-latest
    steps:
      - name: Realizar operacion
        run: |
          n1=7
          n2=2
          case ${{ matrix.operation }} in
            suma)
              echo "Suma: $((n1 + n2))"
              ;;
            resta)
              echo "Resta: $((n1 - n2))"
              ;;
            multiplicacion)
              echo "Multiplicacion: $((n1 * n2))"
              ;;
            division)
              if [ "$n2" -ne 0 ]; then
                echo "Division: $((n1 / n2))"
              else
                echo "No se puede dividir por cero"
              fi
              ;;
          esac
